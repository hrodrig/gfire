# GFire example configuration — copy to gfire.yaml and adjust.
server:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  queues:
    - default
  dequeue_timeout: 5s
  shutdown_timeout: 30s
  default_timeout: 30s
  max_body_size: 10485760

queue_limits:
  default: 0

heartbeat:
  interval: 5s
  timeout: 30s
  orphan_timeout: 5m

scheduler:
  interval: 1s
  batch_size: 100

storage:
  backend: memory   # memory | postgres | redis | valkey
  postgres:
    dsn: "postgres://gfire:gfire@localhost:5432/gfire?sslmode=disable"
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0

auth:
  enabled: false
  token: ""

handlers:
  - name: echo
    cmd: /bin/echo

logging:
  level: info
  format: text

metrics:
  enabled: true
