# Release: tag push v* → fail-closed quality gates → GoReleaser (binaries + GHCR).
# Trigger: git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z (from main).
# Red fmt/vet/test/cover/gocyclo/security/docker-scan → abort; GoReleaser never runs.
# Local bar: make release-check (CI tags use STRICT_RELEASE=1 for docker-scan).

name: Release

permissions:
  contents: write
  packages: write
  id-token: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      # make cover enforces COVER_MIN via bc (not preinstalled on ubuntu-latest).
      - name: Install bc (coverage gate)
        run: sudo apt-get update && sudo apt-get install -y bc

      # docker-scan (STRICT_RELEASE=1) needs Docker; multi-arch GoReleaser needs QEMU/buildx.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run release checks (fail-closed)
        run: STRICT_RELEASE=1 make release-check

      - name: Log in to GH Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # GoReleaser sboms: invokes syft; not bundled by goreleaser-action.
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
